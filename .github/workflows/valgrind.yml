name: Valgrind

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    # Monday morning, so a new nginx release that breaks the module shows
    # up here and not in somebody's build
    - cron: '7 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  valgrind:
    name: run the suite under valgrind
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # slow, and a pull request is already covered by Build & Test
    if: github.event_name != 'pull_request'

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup
        with:
          packages: valgrind
          cpan: Protocol::WebSocket

      - name: Build nginx
        run: |
          . .github/versions.env
          ci/build.sh "$NGINX_VERSION" "$HOME/nginx"

      - name: Run the handshake tests under valgrind
        run: |
          set -o pipefail
          # Only t/handshake.t, and that is measured: the whole suite under
          # valgrind ran for over 24 minutes without finishing, all of it in
          # t/transport.t, which drives real sockets with sleeps.  Under
          # valgrind that test is not telling either -- two writes end up in
          # one websocket frame and it expects them apart.  t/handshake.t
          # takes 45 seconds and covers the path where this module does its
          # own allocation.
          #
          # The client timeout has to go up as well, or TEST 2 fails on the
          # clock rather than on the module: it waits for a refused connect,
          # and under valgrind nginx answers later than the default three
          # seconds.
          TEST_NGINX_USE_VALGRIND=1 TEST_NGINX_TIMEOUT=30 \
            TEST_NGINX_BINARY="$HOME/nginx/sbin/nginx" \
            prove t/handshake.t 2>&1 | tee valgrind.log

      - name: No findings allowed
        run: |
          if grep -niE "invalid read|invalid write|definitely lost|indirectly lost|uninitialised|uninitialized value|conditional jump|mismatched free" valgrind.log; then
            echo "valgrind reported the lines above" >&2
            exit 1
          fi
          echo "valgrind found nothing"
