# The part of the reload test that differs per module.  ci/reload.sh sources
# this with $WORK and $PORT already set and then drives the reloads.
#
#     RELOAD_HTTP    directives for the http block, may be empty
#     RELOAD_SERVER  directives for the server block
#     RELOAD_EXPECT  what reload_probe has to print
#     reload_probe   prints what the server answered

RELOAD_HTTP=

RELOAD_SERVER="
        location /probe {
            websockify_pass 127.0.0.1:$((PORT + 1));
        }"

RELOAD_EXPECT=101

# A reload that had detached the module would answer the plain GET from the
# static handler of the location, not with a websocket handshake.  So the
# probe sends a real handshake and reads the status line: 101 can only come
# from this module.  The peer has to exist for that, because a refused
# upstream is answered with 502 -- which is itself a fix of ours.
mkdir -p "$WORK"
cat > "$WORK/peer.py" <<'PEER'
import socket
import sys
import threading


def serve(c):
    try:
        c.sendall(b"RFB 003.008\n")
        while True:
            if not c.recv(4096):
                break
    except OSError:
        pass
    finally:
        try:
            c.close()
        except OSError:
            pass


srv = socket.socket()
srv.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1)
srv.bind(("127.0.0.1", int(sys.argv[1])))
srv.listen(16)
# ci/reload.sh traps EXIT for its own cleanup and would overwrite a trap set
# here, so the peer ends itself rather than being ended.
srv.settimeout(300)
print("ready", flush=True)
while True:
    try:
        conn, _ = srv.accept()
    except socket.timeout:
        break
    threading.Thread(target=serve, args=(conn,), daemon=True).start()
PEER

python3 "$WORK/peer.py" "$((PORT + 1))" > "$WORK/peer.out" 2>&1 &
n=0
while [ $n -lt 50 ]; do
	grep -q ready "$WORK/peer.out" 2> /dev/null && break
	n=$((n + 1))
	sleep 0.1 2> /dev/null || sleep 1
done

reload_probe() {
	curl -s -o /dev/null -w '%{http_code}' --max-time 5 \
		-H 'Connection: Upgrade' \
		-H 'Upgrade: websocket' \
		-H 'Sec-WebSocket-Key: n2wfgJF+qto2ahU4+aoNkQ==' \
		-H 'Sec-WebSocket-Protocol: base64' \
		-H 'Sec-WebSocket-Version: 13' \
		-H 'Origin: http://0' \
		"http://127.0.0.1:$PORT/probe" 2> /dev/null || true
}
